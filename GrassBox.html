<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GrassBox 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #112211;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #172b17;
    }

    /* Інфо-панель */
    .hud {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Чат */
    #chat-box {
      position: absolute;
      bottom: 15px; left: 15px;
      width: 280px;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
      padding: 8px;
      z-index: 10;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #chat-messages {
      height: 100px;
      overflow-y: auto;
      font-size: 12px;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    #chat-messages div { word-break: break-word; }
    #chat-input-container { display: flex; gap: 4px; }
    #chat-input {
      flex: 1;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      outline: none;
      font-size: 12px;
    }
    #chat-send {
      background: #2e7d32;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Кнопка EULA */
    #eula-btn {
      position: absolute;
      bottom: 15px; right: 15px;
      background: rgba(0,0,0,0.65);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    #eula-btn:hover { color: #fff; border-color: #fff; }

    /* Сенсорне керування для телефонів */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 25px; right: 25px;
      width: 130px; height: 130px;
      z-index: 15;
    }
    .touch-btn {
      position: absolute;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      color: white;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    #btn-up { top: 0; left: 45px; }
    #btn-down { bottom: 0; left: 45px; }
    #btn-left { top: 45px; left: 0; }
    #btn-right { top: 45px; right: 0; }

    /* Модальне вікно EULA */
    #modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 20px;
      flex-direction: column;
    }
    #modal-content {
      flex: 1;
      overflow-y: auto;
      background: #1e1e1e;
      color: #ddd;
      padding: 15px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #modal-close {
      margin-top: 10px;
      align-self: flex-end;
      background: #c62828;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="hud">
  Позиція: X: <span id="pos-x">0</span>, Y: <span id="pos-y">0</span> | Онлайн: <span id="online-count">1</span>
</div>

<div id="chat-box">
  <div id="chat-messages">
    <div style="color:#aaa;">Ласкаво просимо до GrassBox!</div>
  </div>
  <div id="chat-input-container">
    <input type="text" id="chat-input" placeholder="Напишіть..." maxlength="100">
    <button id="chat-send">></button>
  </div>
</div>

<button id="eula-btn">Правила / EULA</button>

<div id="touch-controls">
  <div class="touch-btn" id="btn-up">W</div>
  <div class="touch-btn" id="btn-down">S</div>
  <div class="touch-btn" id="btn-left">A</div>
  <div class="touch-btn" id="btn-right">D</div>
</div>

<div id="modal">
  <div id="modal-content">Завантаження правил...</div>
  <button id="modal-close">Закрити</button>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initGrass();
  }

  // Гравець (Кубик)
  const player = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    size: 22,
    speed: 4,
    color: '#e53935'
  };

  const keys = {};

  // Спокійні природні відтінки трави
  const grassColors = [
    '#255c25',
    '#2d6a2d',
    '#357a35',
    '#3b8a3b'
  ];

  let grassBlades = [];
  function initGrass() {
    grassBlades = [];
    const count = Math.floor((canvas.width * canvas.height) / 320); 
    for (let i = 0; i < count; i++) {
      grassBlades.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        height: 14 + Math.random() * 8,
        offset: Math.random() * Math.PI * 2, // Фаза для вітру
        stepSpeed: 0.03 + Math.random() * 0.03, // Швидкість коливання
        bend: 0,
        color: grassColors[Math.floor(Math.random() * grassColors.length)],
        thickness: 1 + Math.random() * 0.5
      });
    }
  }

  window.addEventListener('resize', resizeCanvas);

  window.addEventListener('keydown', e => { keys[e.code] = true; keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.code] = false; keys[e.key.toLowerCase()] = false; });

  if (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) {
    document.getElementById('touch-controls').style.display = 'block';
  }

  function setupTouchBtn(id, code) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
  }
  setupTouchBtn('btn-up', 'KeyW');
  setupTouchBtn('btn-down', 'KeyS');
  setupTouchBtn('btn-left', 'KeyA');
  setupTouchBtn('btn-right', 'KeyD');

  let windTimer = 0;

  function update() {
    if (keys['KeyA'] || keys['a']) player.x += player.speed;
    if (keys['KeyD'] || keys['d']) player.x -= player.speed;
    if (keys['KeyW'] || keys['w']) player.y -= player.speed;
    if (keys['KeyS'] || keys['s']) player.y += player.speed;

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    document.getElementById('pos-x').textContent = Math.round(player.x);
    document.getElementById('pos-y').textContent = Math.round(player.y);

    windTimer += 0.04; // Час для коливання від вітру

    const pCenterX = player.x + player.size / 2;
    const pCenterY = player.y + player.size / 2;

    grassBlades.forEach(blade => {
      // Природне коливання право-ліво від вітру
      const windSway = Math.sin(windTimer + blade.offset) * 4;

      const dist = Math.hypot(blade.x - pCenterX, blade.y - pCenterY);
      if (dist < 30) {
        // Коли кубик наступає, трава гнеться від нього
        const push = (blade.x < pCenterX ? -1 : 1) * (30 - dist) * 0.5;
        blade.bend = push;
      } else {
        // Повернення до коливання вітром
        blade.bend += (windSway - blade.bend) * 0.1;
      }
    });
  }

  function draw() {
    ctx.fillStyle = '#132213';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    grassBlades.forEach(blade => {
      ctx.strokeStyle = blade.color;
      ctx.lineWidth = blade.thickness;
      ctx.beginPath();
      ctx.moveTo(blade.x, blade.y);
      // Малюємо з урахуванням згину (вітер / наступи)
      const tipX = blade.x + blade.bend;
      const tipY = blade.y - blade.height;
      ctx.lineTo(tipX, tipY);
      ctx.stroke();
    });

    // Кубик
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(player.x, player.y, player.size, player.size);
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  resizeCanvas();
  gameLoop();

  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');
  const chatMessages = document.getElementById('chat-messages');

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    const msg = document.createElement('div');
    msg.textContent = `Ви: ${text}`;
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    chatInput.value = '';
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  const modal = document.getElementById('modal');
  const modalContent = document.getElementById('modal-content');
  const eulaBtn = document.getElementById('eula-btn');
  const modalClose = document.getElementById('modal-close');

  eulaBtn.addEventListener('click', async () => {
    modal.style.display = 'flex';
    try {
      const res = await fetch('RULES_AND_EULA.txt');
      const text = await res.text();
      modalContent.textContent = text;
    } catch {
      modalContent.textContent = "Не вдалося завантажити RULES_AND_EULA.txt";
    }
  });

  modalClose.addEventListener('click', () => { modal.style.display = 'none'; });
</script>
</body>
</html>
