<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wildlands — Rise of Civilization</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="login" class="overlay"><div class="card"><h1>🌿 WILDLANDS</h1><p>Rise of Civilization</p><label>Ім'я<input id="nickname" value="Мандрівник" maxlength="18"></label><label>Керування<select id="mode"><option value="pc">ПК</option><option value="mobile">Телефон</option></select></label><label>Колір персонажа <input id="color" type="color" value="#75d69a"></label><button id="start">Увійти у світ</button><small id="loginStatus"></small></div></div>
<div id="game" hidden><canvas id="world"></canvas><header><b>WILDLANDS</b><span id="status">Підключення…</span></header><aside class="panel left"><h3>МАНДРІВНИК</h3><div id="playerName"></div><p>🪵 Деревина: <b id="wood">0</b></p><p>🪨 Камінь: <b id="stone">0</b></p><p>🫐 Ягоди: <b id="berries">0</b></p><p>📍 <span id="coords">0,0</span></p></aside><aside class="panel biome"><h3>МІСЦЕВІСТЬ</h3><b id="biomeName">Луки</b><p id="climate"></p></aside><aside class="panel chat"><h3>ЧАТ СВІТУ</h3><div id="chatLog"></div><form id="chatForm"><input id="chatInput" placeholder="Написати…" maxlength="180"><button>➤</button></form></aside><div class="buttons"><button id="gather">✋ Зібрати</button><button id="inventory">🎒 Речі</button></div><div id="mobilePad"><button data-key="w">▲</button><div><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div></div><div id="toast"></div></div>
<script src="https://wildlands-rise-of-civilization.onrender.com/socket.io/socket.io.js"></script><script src="./game.js"></script></body></html>
