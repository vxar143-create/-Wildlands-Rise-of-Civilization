<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrassBox - Multiplayer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2e5a1e;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            max-height: 200px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 8px 8px 0 0;
            color: #fff;
            font-size: 14px;
            max-height: 150px;
            word-break: break-all;
        }
        #chat-form {
            display: flex;
        }
        #chat-input {
            flex-grow: 1;
            padding: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 0 0 8px;
            outline: none;
            font-size: 14px;
        }
        #chat-send {
            padding: 8px 12px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 0 0 8px 0;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    <!-- Підключаємо Socket.IO клієнтську бібліотеку -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="ui">Онлайн: <span id="online-count">1</span></div>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <form id="chat-form" onsubmit="sendChatMessage(event)">
            <input type="text" id="chat-input" placeholder="Написати в чат..." autocomplete="off" maxlength="100">
            <button type="submit" id="chat-send">💬</button>
        </form>
    </div>

    <script>
        // Підключаємося до нашого 24/7 хмарного сервера на Render
        const socket = io('https://grassbox-yv7s.onrender.com');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Позиція нашого гравця
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 30,
            speed: 4,
            color: '#e53935'
        };

        // Словник інших гравців онлайн
        const enemies = {};

        // Генерація декоративної трави на фоні (органічна щільність)
        const grassBlades = [];
        for (let i = 0; i < 300; i++) {
            grassBlades.push({
                x: Math.random() * 3000 - 1000,
                y: Math.random() * 3000 - 1000,
                height: 15 + Math.random() * 20,
                color: Math.random() > 0.5 ? '#3b7a2e' : '#4d9a3d'
            });
        }

        // Керування клавіатурою (WASD / Стрілки)
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Обробка подій сервера
        socket.on('update-online', (count) => {
            document.getElementById('online-count').innerText = count;
        });

        socket.on('enemy-move', (data) => {
            if (!enemies[data.id]) {
                enemies[data.id] = { x: data.x, y: data.y, color: '#3f51b5' };
            } else {
                enemies[data.id].x = data.x;
                enemies[data.id].y = data.y;
            }
        });

        socket.on('player-disconnected', (id) => {
            delete enemies[id];
        });

        socket.on('chat-message', (data) => {
            const chatMessages = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.innerHTML = `<b>${data.id.substring(0, 4)}:</b> ${escapeHtml(data.text)}`;
            chatMessages.appendChild(msgEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('chat-message', text);
                input.value = '';
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Головний ігровий цикл
        function update() {
            let moved = false;
            if (keys['w'] || keys['arrowup']) { player.y -= player.speed; moved = true; }
            if (keys['s'] || keys['arrowdown']) { player.y += player.speed; moved = true; }
            if (keys['a'] || keys['arrowleft']) { player.x -= player.speed; moved = true; }
            if (keys['d'] || keys['arrowright']) { player.x += player.speed; moved = true; }

            if (moved) {
                socket.emit('player-move', { x: player.x, y: player.y });
            }
        }

        function draw() {
            ctx.fillStyle = '#2e5a1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Зміщення камери за гравцем
            ctx.save();
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // Малюємо траву з вітровою анімацією
            const time = Date.now() / 300;
            grassBlades.forEach((blade, index) => {
                ctx.strokeStyle = blade.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(blade.x, blade.y);
                let wind = Math.sin(time + index) * 5;
                ctx.quadraticCurveTo(blade.x + wind / 2, blade.y - blade.height / 2, blade.x + wind, blade.y - blade.height);
                ctx.stroke();
            });

            // Малюємо інших гравців
            for (let id in enemies) {
                let en = enemies[id];
                ctx.fillStyle = en.color;
                ctx.fillRect(en.x - 15, en.y - 15, 30, 30);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(id.substring(0, 4), en.x - 12, en.y - 20);
            }

            // Малюємо нашого гравця (кубик)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - 15, player.y - 15, 30, 30);
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText('Я', player.x - 6, player.y - 20);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
